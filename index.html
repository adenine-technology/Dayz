 <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DayZ Field Kit</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    :root {
      --bg: #0d0f0c;
      --panel: #141712;
      --border: #2c3325;
      --text: #cfd4c5;
      --dim: #6d7563;
      --gold: #c5a059;
      --red: #c93b3b;
      --green: #5a8a47;
    }
    body {
      margin: 0; padding: 0; background: var(--bg); color: var(--text);
      font-family: monospace, -apple-system, sans-serif; font-size: 13px;
      user-select: none; overflow: hidden;
    }
    nav {
      display: flex; background: #080907; border-bottom: 1px solid var(--border);
      height: 44px; position: fixed; top: 0; width: 100%; z-index: 2000;
    }
    nav button {
      flex: 1; background: none; border: none; color: var(--dim);
      font-family: inherit; font-size: 11px; font-weight: bold;
      letter-spacing: 1px; text-transform: uppercase; border-bottom: 2px solid transparent;
    }
    nav button.active { color: var(--gold); border-bottom-color: var(--gold); background: #11140e; }
    .tab-page { display: none; height: calc(100vh - 44px); margin-top: 44px; overflow-y: auto; }
    .tab-page.active { display: block; }

    #map-wrap { display: flex; flex-direction: column; height: 100%; }
    #map { flex: 1; width: 100%; background: #070906; }
    .map-bar {
      padding: 8px; background: var(--panel); border-top: 1px solid var(--border);
      display: flex; flex-direction: column; gap: 6px;
    }
    .coord-inputs { display: flex; gap: 6px; }
    .coord-inputs input {
      flex: 1; padding: 6px; background: #080907; border: 1px solid var(--border);
      color: var(--gold); font-family: inherit; font-size: 11px;
    }
    .action-row { display: flex; gap: 6px; }
    .btn-act {
      flex: 1; padding: 7px; background: #1b2116; border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 10px; font-weight: bold;
    }
    .btn-act.set-orig { color: var(--green); border-color: var(--green); }
    .btn-act.set-dest { color: var(--red); border-color: var(--red); }
    .btn-act.reset { color: var(--dim); }

    .status-panel {
      padding: 6px; background: #080a07; border-top: 1px solid #1c2117;
      text-align: center; font-size: 11px; color: var(--gold);
    }

    .container { padding: 12px; }
    .field-label { display: block; font-size: 10px; color: var(--dim); margin: 6px 0 2px; text-transform: uppercase; }
    input[type="text"], input[type="number"], select {
      width: 100%; padding: 8px; background: var(--panel); border: 1px solid var(--border);
      color: var(--text); font-family: inherit; font-size: 12px; border-radius: 0;
    }
    .sugg-box {
      background: #11140e; border: 1px solid var(--border); border-top: none;
      max-height: 140px; overflow-y: auto; display: none; margin-bottom: 8px;
    }
    .sugg-row {
      padding: 8px; border-bottom: 1px solid #1a1e16; display: flex;
      justify-content: space-between; cursor: pointer;
    }

    .tactical-card {
      background: var(--panel); border: 1px solid var(--border);
      padding: 10px; margin-bottom: 6px; border-left: 3px solid var(--dim);
    }
    .tactical-card.striked { opacity: 0.4; text-decoration: line-through; border-left-color: #333; }
    .card-head { display: flex; justify-content: space-between; margin-bottom: 4px; }
    .card-title { font-weight: bold; color: var(--gold); font-size: 12px; }
    .card-badge { font-size: 9px; padding: 1px 4px; background: #20261b; color: var(--dim); }
    .card-body { font-size: 11px; color: #a4ad99; line-height: 1.3; }

    .calc-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; margin-top: 8px; }
    .calc-val { background: #0b0d0a; border: 1px solid #1b2117; padding: 6px; }
    .calc-val b { display: block; color: var(--gold); font-size: 14px; }
    .calc-val span { font-size: 9px; color: var(--dim); }

    .tree-layout { display: flex; flex-direction: column; gap: 8px; }
    .tree-tier { border: 1px solid var(--border); padding: 8px; background: var(--panel); }
    .tree-title { font-size: 10px; color: var(--dim); margin-bottom: 6px; text-transform: uppercase; }
    .tree-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .tree-btn {
      background: #1b2017; border: 1px solid #283021; color: var(--text);
      padding: 8px 4px; font-family: inherit; font-size: 10px; text-align: center;
    }
    .tree-btn:active { background: var(--gold); color: #000; }
    .diag-box {
      margin-top: 10px; padding: 10px; border: 1px solid var(--gold);
      background: #0d0f0c; min-height: 80px;
    }
    .diag-header { font-size: 12px; font-weight: bold; color: var(--gold); margin-bottom: 6px; }
    .diag-sec { font-size: 11px; margin-bottom: 4px; }
    .diag-sec span { color: var(--dim); }
  </style>
</head>
<body>

  <nav>
    <button class="active" onclick="tab('map-page', this)">Map</button>
    <button onclick="tab('craft-page', this)">Craft</button>
    <button onclick="tab('build-page', this)">Build</button>
    <button onclick="tab('shop-page', this)">Loot</button>
    <button onclick="tab('med-page', this)">Medical</button>
  </nav>

  <div id="map-page" class="tab-page active">
    <div id="map-wrap">
      <div id="map"></div>
      <div class="map-bar">
        <div class="coord-inputs">
          <input type="number" id="manualX" placeholder="Coord X (0 - 15360)">
          <input type="number" id="manualZ" placeholder="Coord Z (0 - 15360)">
        </div>
        <div class="action-row">
          <button class="btn-act set-orig" onclick="setOrigin()">START POINT</button>
          <button class="btn-act set-dest" onclick="setDestination()">NEW DESTINATION</button>
          <button class="btn-act reset" onclick="resetAllRouting()">CLEAR</button>
        </div>
      </div>
      <div id="coordStatus" class="status-panel">TAP MAP OR TYPE COORDS</div>
    </div>
  </div>

  <div id="craft-page" class="tab-page">
    <div class="container">
      <span class="field-label">Search Recipe / Ingredients</span>
      <input type="text" id="craftInput" placeholder="e.g. Bone, Rope, Suppressor..." oninput="searchCrafting(this.value)">
      <div id="craftSuggestions" class="sugg-box"></div>
      <div id="craftContainer" style="margin-top: 8px;"></div>
    </div>
  </div>

  <div id="build-page" class="tab-page">
    <div class="container">
      <span class="field-label">Structure Asset</span>
      <select id="buildType" onchange="handleBuildTypeChange()">
        <option value="wood-wall">Fence (Wooden Planks)</option>
        <option value="metal-wall">Fence (Metal Sheets)</option>
        <option value="gate-wood">Gate (Wood + Wire)</option>
        <option value="gate-metal">Gate (Metal + Wire)</option>
        <option value="watchtower">Watchtower (Multi-Level)</option>
      </select>

      <div id="wallFields">
        <span class="field-label">Quantity</span>
        <input type="number" id="buildCount" value="1" min="1" oninput="updateBuild()">
      </div>

      <div id="towerFields" style="display:none;">
        <span class="field-label">Tower Elevation Level</span>
        <select id="towerFloors" onchange="updateBuild()">
          <option value="1">Level 1 (Ground Stage)</option>
          <option value="2">Level 2 (Mid Stage)</option>
          <option value="3">Level 3 (Full Stage)</option>
        </select>
        <div style="margin-top: 8px;">
          <input type="checkbox" id="towerRoof" onchange="updateBuild()">
          <label for="towerRoof" style="font-size: 11px;">Construct Top Roof</label>
        </div>
      </div>

      <div id="buildOutput" class="tactical-card" style="margin-top: 12px; border-left-color: var(--gold);"></div>
    </div>
  </div>

  <div id="shop-page" class="tab-page">
    <div class="container">
      <span class="field-label">Target Equipment Search</span>
      <input type="text" id="shopInput" placeholder="e.g. Spark Plug, Saline, Planks..." oninput="handleShopInput(this.value)">
      <div id="shopSuggestions" class="sugg-box"></div>
      <button class="btn-act" style="width:100%; margin: 6px 0;" onclick="addShopItem()">LOG ITEM</button>
      <div id="shopContainer" style="margin-top: 8px;"></div>
      <button onclick="clearShop()" style="background:none; border:none; color:var(--red); font-family:inherit; font-size:10px; width:100%; padding:12px 0;">PURGE COMPLETED</button>
    </div>
  </div>

  <div id="med-page" class="tab-page">
    <div class="container">
      <div class="tree-layout">
        <div class="tree-tier">
          <div class="tree-title">Primary HUD Symptom Tree</div>
          <div class="tree-grid">
            <button class="tree-btn" onclick="inspectNode('CHOLERA', 'Contaminated Pond/River Water', 'Tetracycline (1 pill until symbol clears). Charcoal Tablets secondary. Rehydrate in small sips.')">VOMITING</button>
            <button class="tree-btn" onclick="inspectNode('WOUND INFECTION', 'Untreated cuts or dirty bandage', 'STAGE 1: Alcohol / Iodine / Tincture directly to wound. STAGE 2: 4x Tetracycline consecutive.')">FEVER / GRUNT</button>
            <button class="tree-btn" onclick="inspectNode('INFLUENZA / COLD', 'Freezing rain, wet clothes, hypothermia', 'Heat buff (stand near fire). Multivitamins to restore immunity, or Tetracycline.')">COUGH / SNEEZE</button>
            <button class="tree-btn" onclick="inspectNode('KURU (BRAIN FLU)', 'Human meat, human fat, cooked human guts', 'INCURABLE. Involuntary laughter, violent weapon sway. Terminal.')">LAUGHING</button>
            <button class="tree-btn" onclick="inspectNode('GAS POISONING (CONTAMINATED ZONE)', 'Artillery dirty strike exposure without NBC', 'PO-X Antidote Injector immediately, or IV Blood Bag (collected before exposure).')">COUGHING BLOOD</button>
            <button class="tree-btn" onclick="inspectNode('SALMONELLA', 'Consuming raw meat, chicken, or dirty hands', 'Charcoal Tablets (take 1, wait for pill icon to expire before next). Avoid vomiting.')">GUT CRAMPS</button>
          </div>
        </div>
      </div>
      <div id="medOut" class="diag-box">
        <div class="diag-header">DIAGNOSTIC IDLE</div>
        <div class="diag-sec">Select symptomatic indicator above to generate treatment sequence.</div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  </script>
</body>
</html>
